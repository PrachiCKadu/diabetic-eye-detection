<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Dia Vision</title>

    <link rel="stylesheet" href="register.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

<div class="page">

    <div class="container">

        <!-- logo --> 

        <div class="logo-section">

            <img
                src="img/Dia.png"
                alt="Dia Vision Logo">

            <h1>
                Dia Vision
            </h1>

            <p>
                Advanced AI Screening for Diabetic Retinopathy
            </p>

        </div>

<!-- ------------------------ Slide Button ----------------------------- -->

        <div class="roletab">

            <div
                class="role-slider"
                id="roleSlider">
            </div>


            <!-- PATIENT -->

            <button
                class="role active"
                type="button"
                id="patientRole">

                <i class="fa-solid fa-user"></i>

                Patient

            </button>


            <!-- DOCTOR -->

            <button
                class="role"
                type="button"
                id="doctorRole">

                <i class="fa-solid fa-user-doctor"></i>

                Doctor

            </button>

        </div>


        <div class="register-title">

            <h2 id="formTitle">
                Create Patient Account
            </h2>

            <p id="formSubtitle">
                Register to access your diabetic eye screening
            </p>

        </div>

<!-- ------------------------ Registration Form ----------------------------- -->

        <form
            id="registrationForm"
            novalidate>


<!-- ------------------------ Patient form ----------------------------- -->

            <div
                class="form-section"
                id="patientForm">


                <!-- ROW 1 -->

                <div class="input-row">


        <!-- Full Name -->

                    <div class="input-container">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="patientFullName"
                            placeholder="Full Name"
                            autocomplete="name">

                    </div>


        <!-- Email -->

                    <div class="input-container">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="patientEmail"
                            placeholder="Email Address"
                            autocomplete="email">

                    </div>

                </div>


                <!-- ROW 2 -->

                <div class="input-row">


        <!-- Date of Birth -->

                    <div class="input-container">

                        <i class="fa-regular fa-calendar"></i>

                        <input
                            type="date"
                            id="patientDob">

                    </div>


        <!-- Gender -->

                    <div class="input-container">

                        <i class="fa-solid fa-venus-mars"></i>

                        <select id="patientGender">

                            <option
                                value=""
                                selected
                                disabled>

                                Select Gender

                            </option>

                            <option value="male">
                                Male
                            </option>

                            <option value="female">
                                Female
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ROW 3 -->

                <div class="input-row">


        <!-- Password -->

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="patientPassword"
                            placeholder="Password"
                            autocomplete="new-password">

                        <i
                            class="fa-regular fa-eye password-toggle"
                            data-target="patientPassword">
                        </i>

                    </div>


        <!-- Confirm Password -->

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="patientConfirmPassword"
                            placeholder="Confirm Password"
                            autocomplete="new-password">

                        <i
                            class="fa-regular fa-eye password-toggle"
                            data-target="patientConfirmPassword">
                        </i>

                    </div>

                </div>

            </div>

<!-- ------------------------ Doctor form  ----------------------------- -->

            <div
                class="form-section"
                id="doctorForm"
                style="display: none;">


                <!-- ROW 1 -->

                <div class="input-row">

                    <div class="input-container">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="doctorFullName"
                            placeholder="Full Name"
                            autocomplete="name">

                    </div>


                    <div class="input-container">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="doctorEmail"
                            placeholder="Email Address"
                            autocomplete="email">

                    </div>

                </div>


                <!-- ROW 2 -->

                <div class="input-row">


          <!-- Medical Registration Number -->

                    <div class="input-container">

                        <i class="fa-solid fa-id-card"></i>

                        <input
                            type="text"
                            id="registrationNumber"
                            placeholder="Medical Registration No."
                            autocomplete="off">

                    </div>


         <!-- Medical Council -->

                    <div class="input-container">

                        <i class="fa-solid fa-building-columns"></i>

                        <select id="medicalCouncil">

                            <option
                                value=""
                                selected
                                disabled>

                                Select Medical Council

                            </option>

                            <option value="NMC">
                                National Medical Commission (NMC)
                            </option>

                            <option value="Maharashtra Medical Council">
                                Maharashtra Medical Council
                            </option>

                            <option value="Delhi Medical Council">
                                Delhi Medical Council
                            </option>

                            <option value="Karnataka Medical Council">
                                Karnataka Medical Council
                            </option>

                            <option value="Gujarat Medical Council">
                                Gujarat Medical Council
                            </option>

                            <option value="Tamil Nadu Medical Council">
                                Tamil Nadu Medical Council
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ROW 3 -->

                <div class="input-row">


        <!-- Qualification -->

                    <div class="input-container">

                        <i class="fa-solid fa-graduation-cap"></i>

                        <select id="qualification">

                            <option
                                value=""
                                selected
                                disabled>

                                Select Qualification

                            </option>

                            <option value="MBBS">
                                MBBS
                            </option>

                            <option value="MD">
                                MD
                            </option>

                            <option value="MS">
                                MS
                            </option>

                            <option value="DNB">
                                DNB
                            </option>

                            <option value="DM">
                                DM
                            </option>

                            <option value="MCh">
                                MCh
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


        <!-- Specialization -->

                    <div class="input-container">

                        <i class="fa-solid fa-stethoscope"></i>

                        <select id="specialization">

                            <option
                                value=""
                                selected
                                disabled>

                                Select Specialization

                            </option>

                            <option value="Ophthalmologist">
                                Ophthalmologist
                            </option>

                            <option value="Retina Specialist">
                                Retina Specialist
                            </option>

                            <option value="Diabetologist">
                                Diabetologist
                            </option>

                            <option value="Endocrinologist">
                                Endocrinologist
                            </option>

                            <option value="General Physician">
                                General Physician
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ROW 4 -->

                <div class="input-row">


        <!-- Password -->

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="doctorPassword"
                            placeholder="Password"
                            autocomplete="new-password">

                        <i
                            class="fa-regular fa-eye password-toggle"
                            data-target="doctorPassword">
                        </i>

                    </div>


         <!-- Confirm Password -->

                    <div class="input-container">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="doctorConfirmPassword"
                            placeholder="Confirm Password"
                            autocomplete="new-password">

                        <i
                            class="fa-regular fa-eye password-toggle"
                            data-target="doctorConfirmPassword">
                        </i>

                    </div>

                </div>

            </div>

            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms">

                    <span>

                        I agree to the

                        <a href="#">
                            Terms of Service
                        </a>

                        and

                        <a href="#">
                            Privacy Policy
                        </a>

                    </span>

                </label>

            </div>

            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>

        <div class="login-link">

            <span>
                Already have an account?
            </span>

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

<!-- ------------------------ Footer part  ----------------------------- -->

    <footer>

        <div class="footer-link">

            <a href="#">
                About Dia Vision
            </a>

            <a href="#">
                Consultant Credentialing
            </a>

            <a href="#">
                Terms Of Services
            </a>

            <a href="#">
                Security Policy
            </a>

            <a href="#">
                Privacy Policy
            </a>

        </div>


        <div class="copyrights">
            Dia Vision
        </div>

    </footer>

</div>


<!-- JavaScript -->
<script src="register.js"></script>

</body>

</html>
